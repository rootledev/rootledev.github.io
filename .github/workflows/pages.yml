name: pages

# rootle.dev — assembled by website/build.py from THIS repo: the
# landing page from website/, docs pages from doc/*.md, demo GIFs from
# img/. The app repo (rootledev/rootle) is checked out at code/ for the
# version stamp and install.sh.
on:
  workflow_dispatch:
  # The app repo's release/demo workflows ping us to redeploy (version
  # chip + fresh GIFs). Needs a token with write access on their side
  # (SITE_REPO_TOKEN there) — dispatches always run.
  repository_dispatch:
    types: [rebuild]
  push:
    branches: [main]
    paths:
      - "website/**"
      - "doc/**"
      - "img/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The app repo: version stamp (Cargo.toml) + install.sh. Public,
      # no auth needed.
      - uses: actions/checkout@v7
        with:
          repository: rootledev/rootle
          path: code

      - uses: astral-sh/setup-uv@v7

      - name: Build site
        run: uv run --with markdown --with pymdown-extensions --with pygments python website/build.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
